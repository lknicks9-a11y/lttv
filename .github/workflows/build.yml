# Builds and tests LTTV, then builds the Fire TV / Android TV APK.
# The debug APK is attached to every run as an artifact ("lttv-debug-apk").
# For a signed release APK, add these repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end test (remote-control navigation, import, guide, playback)
        # Timing-sensitive on shared runners: reported, but it doesn't block the APK.
        continue-on-error: true
        run: node scripts/e2e.mjs --chrome "$(which google-chrome || which chromium)" --shots test-results/screenshots 2>&1 | tee test-results/e2e-ci.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results

  # Builds the APK on its own, so a test hiccup never blocks the Fire TV app.
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runners come with the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Point Gradle at the Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --no-audit --no-fund
      - run: npm run build:android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lttv-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # A direct download link for the Fire TV "Downloader" app:
      # https://github.com/<owner>/<repo>/releases/latest/download/lttv.apk
      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk lttv.apk
          gh release delete tv --yes --cleanup-tag || true
          gh release create tv lttv.apk --title "LTTV for Fire TV — build ${GITHUB_RUN_NUMBER}" --notes "build ${GITHUB_RUN_NUMBER} of main (${GITHUB_SHA::7}). The app offers this update itself (Settings → Check for updates). Downloader: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lttv.apk" --latest
      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        with:
          name: lttv-release-apk
          path: android/app/build/outputs/apk/release/*.apk
