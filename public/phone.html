<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <title>LTTV Phone</title>
    <link rel="icon" href="icon.svg" />
    <!-- iPhone: Share → Add to Home Screen opens it full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LTTV Phone" />
    <meta name="theme-color" content="#08080a" />
    <link rel="apple-touch-icon" href="apps/lttv.png" />
    <style>
      @font-face { font-family: Inter; src: url(fonts/InterVariable.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
      :root { --bg: #08080a; --card: rgba(255,255,255,.07); --line: rgba(255,255,255,.12); --fg: #f5f5f7; --dim: #8e8e96; --accent: #4cc2ff; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); min-height: 100vh; }
      button, .button, input { font: inherit; color: inherit; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 12px 14px; }
      button, .button { cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
      button:active { transform: scale(.97); background: rgba(255,255,255,.14); }
      button.primary, .button.primary { background: var(--fg); color: #000; border-color: transparent; font-weight: 700; }
      button.ghost { background: none; border-color: transparent; color: var(--accent); padding: 8px 4px; }
      button:disabled { opacity: .5; }
      input { width: 100%; background: rgba(255,255,255,.05); outline: none; }
      input:focus { border-color: var(--accent); }
      h1 { font-size: 26px; letter-spacing: -.02em; margin: 8px 0 0; }
      h2 { font-size: 22px; margin: 18px 0 10px; }
      h3 { margin: 16px 0 8px; font-weight: 600; }
      .dim { color: var(--dim); } .small { font-size: 13px; } .pad { padding: 12px 16px; }
      .err { color: #ff6b6b; }
      .logo { font-weight: 800; font-size: 26px; letter-spacing: -.035em; } .logo span { color: var(--accent); }
      .center { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
      .signin { max-width: 420px; margin: 0 auto; padding: 48px 22px; display: flex; flex-direction: column; gap: 12px; }
      .page { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
      .dname { font-weight: 700; }
      .list { display: flex; flex-direction: column; gap: 10px; }
      .device { text-align: left; padding: 16px; }
      .now { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .nowname { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; } .nowname img { width: 36px; height: 36px; object-fit: contain; }
      .row { display: flex; gap: 8px; } .row > * { flex: 1; }
      .tabs { display: flex; gap: 6px; margin: 14px 0; background: var(--card); border-radius: 14px; padding: 4px; }
      .tabs button { flex: 1; border: 0; background: none; padding: 9px; }
      .tabs button.on { background: rgba(255,255,255,.16); font-weight: 700; }
      .remote { display: flex; flex-direction: column; gap: 16px; align-items: center; }
      .dpad { display: grid; grid-template-columns: repeat(3, 78px); grid-template-rows: repeat(3, 78px); gap: 8px; margin-top: 8px; }
      .dpad button { border-radius: 50%; font-size: 22px; } .dpad .ok { background: rgba(255,255,255,.16); font-weight: 800; }
      .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
      .keys button { padding: 12px 4px; font-size: 14px; }
      .type { display: flex; gap: 8px; width: 100%; } .type input { flex: 1; }
      .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
      .chips button { padding: 7px 12px; border-radius: 999px; white-space: nowrap; } .chips button.on { background: var(--fg); color: #000; }
      .game { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      .teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; font-weight: 600; } .teams span:last-child { text-align: right; }
      .streams { display: flex; gap: 6px; flex-wrap: wrap; } .streams button { padding: 7px 10px; font-size: 13px; }
      .channel { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; }
      .channel img, .nologo { width: 40px; height: 40px; object-fit: contain; flex: none; display: inline-block; }
      .sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; z-index: 20; }
      .sheet { width: 100%; background: #16161a; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
      .watch { position: fixed; inset: 0; background: #000; z-index: 30; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
      .watch video { width: 100%; max-height: 70vh; background: #000; border-radius: 12px; }
      .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #24242a; border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; z-index: 40; font-size: 14px; max-width: 90vw; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="phone.js"></script>
  </body>
</html>
