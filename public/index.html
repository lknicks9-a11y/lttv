<!doctype html>
<html lang="en" data-theme="glass">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <title>LTTV</title>
    <link rel="icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iPhone / iPad: Share → Add to Home Screen opens LTTV full screen with its own icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LTTV" />
    <meta name="theme-color" content="#08080a" />
    <link rel="apple-touch-icon" href="apps/lttv.png" />
    <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- Shown at once while the app loads; main.tsx removes it. -->
    <div id="boot" style="position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vw;background:#08080a;color:#f5f5f7;font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif">
      <div id="bootmark" style="width:10vw;height:10vw"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs>
        <linearGradient id="bgt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b32" /><stop offset="1" stop-color="#0b0b0e" /></linearGradient>
        <linearGradient id="bgs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.5" /><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08" /><stop offset="1" stop-color="#ffffff" stop-opacity="0.2" /></linearGradient>
        <linearGradient id="bgh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.2" /><stop offset="1" stop-color="#ffffff" stop-opacity="0" /></linearGradient>
      </defs>
      <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#bgt)" stroke="url(#bgs)" stroke-width="1.4" />
      <path d="M8 22C8 12.6 12.6 8 22 8h20c9.400 0 14 4.600 14 14v3C44 20 20 20 8 25z" fill="url(#bgh)" />
      <g fill="none" stroke="#fff" stroke-width="6.200" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.500 20v25h11.500" />
        <path d="M29.500 20h17M38 20v25" />
      </g>
      <circle class="logo-dot" cx="47.200" cy="44.600" r="3.700" fill="#4cc2ff" /></svg></div>
      <div id="bootname" style="font-size:6.2vw;font-weight:800;letter-spacing:-0.035em;line-height:1">LT<span style="color:#4cc2ff">TV</span></div>
      <div style="font-size:1.55vw;font-weight:500;color:#8e8e96">a YKGR Studios product</div>
    </div>
    <script>
      // Each LTTV app opens with its own name (the Fire TV app passes ?app=…).
      (function () {
        var m = { movies: ['Movies ', '&amp; Shows', '#ff5a5f'], leaguepass: ['League ', 'Pass', '#ff8a1f'], blitz: ['', 'Blitz', '#3ddc84'] };
        var app = new URLSearchParams(location.search).get('app') || 'lttv';
        // The app's own icon (a TV, a clapperboard, a basketball, a football), not LTTV's old mark.
        var mark = document.getElementById('bootmark') || document.querySelector('#boot > div');
        if (mark && /^(lttv|movies|leaguepass|blitz)$/.test(app)) mark.innerHTML = '<img src="apps/' + app + '.png" alt="" style="width:100%;height:100%;display:block">';
        var v = m[app];
        if (!v) return;
        document.getElementById('bootname').innerHTML = v[0] + '<span style="color:' + v[2] + '">' + v[1] + '</span>';
        document.title = (v[0] + v[1]).replace('&amp;', '&');
      })();
    </script>
    <div id="app"></div>
    <noscript>LTTV needs JavaScript.</noscript>
    <script type="module" src="main.js"></script>
  </body>
</html>
